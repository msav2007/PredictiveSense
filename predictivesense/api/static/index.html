<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PredictiveSense</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="app-shell" id="app-shell" data-collapsed="false">
    <header class="topbar">
      <div class="tb-left">
        <span class="tb-brand">PredictiveSense</span>
        <span class="tb-mode" id="tb-mode">Real-time</span>
      </div>
      <div class="tb-right">
        <span class="status-pill" id="status-pill" data-level="ready">Ready</span>
        <span class="dot" id="ws-dot" title="State channel"></span>
        <a class="btn btn-secondary" id="tb-studio" href="/studio" title="Object Learning Studio">Studio</a>
        <button class="btn btn-secondary" id="btn-diagnostics" type="button" aria-pressed="false">Diagnostics</button>
        <button class="btn btn-secondary" id="btn-collapse" type="button" aria-expanded="true" aria-label="Collapse control panel">&rsaquo;</button>
      </div>
    </header>

    <main class="viewport" id="viewport">
      <div class="video-wrap">
        <video id="preview" autoplay muted playsinline></video>
        <div class="overlay-layer" id="overlay-layer"></div>
        <div class="rec-badge" id="rec-badge" hidden><span class="rec-dot"></span> REC <span id="rec-elapsed">0:00</span></div>
        <div class="viewport-msg" id="viewport-msg" hidden></div>
      </div>
    </main>

    <div class="panel-resizer" id="panel-resizer"></div>

    <aside class="control-panel" id="control-panel" aria-label="Controls">
      <button class="panel-reopen" id="panel-reopen" type="button" aria-label="Expand control panel">&lsaquo;</button>
      <div class="panel-scroll">
        <div class="panel-groups" id="panel-body"></div>
      </div>
    </aside>
  </div>

  <script src="/static/app.js" type="module"></script>
</body>
</html>
