[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictivesense"
version = "0.1.0"
description = "PredictiveSense research prototype - Phase 1 input layer (camera enumeration/ownership, browser-worker ingest, backend device + recorded-video sources, raw clip recorder, transport metrics)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary - research prototype" }

# Runtime dependencies. Pinned exactly. Every entry is justified in docs/attribution.md.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.6.1",
    "PyYAML==6.0.2",
    "numpy==2.2.1",
    "psutil==6.1.1",
    "opencv-python==4.10.0.84",
    "python-multipart==0.0.20",
    # Phase 2 perception. CPU build only in the main .venv; the DirectML build
    # (onnxruntime-directml, same module name) is installed ONLY in .venv-dml.
    "onnxruntime==1.24.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    # Phase 6: browser smoke tests for the Object Learning Studio. The ONLY new
    # dependency this phase (two consecutive phases shipped frontend defects the
    # suite reported as fixed). `browser`-marked tests skip cleanly when the
    # package or its Chromium binary is absent - see tests/browser/conftest.py.
    # Base package only; the fixtures are hand-rolled (no pytest-playwright).
    "playwright==1.62.0",
]
# Windows-only: human-readable DirectShow camera names for backend enumeration.
# Never imported at import time; a missing or throwing pygrabber degrades to
# "Camera <index>" and logs once. See predictivesense/camera/enumerate.py.
camera = [
    "pygrabber==0.2",
]

[tool.setuptools.packages.find]
include = ["predictivesense*"]

[tool.setuptools.package-data]
"predictivesense.api.static" = ["**/*.html", "**/*.js", "**/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Project-local basetemp: the shared system temp dir is not reliably writable
# in this sandboxed environment.
addopts = "--import-mode=importlib --basetemp=.pytest_tmp"
markers = [
    "unit: fast, isolated, no threads or I/O",
    "integration: multiple components wired together",
    "slow: runs for several seconds or more",
    "hardware: requires a physical camera; skipped unless --run-hardware is passed",
    "models: requires ONNX weights under models/; skips cleanly when they are absent",
    "dataset: requires the labelled evaluation set under data/eval/; skips cleanly when it is absent",
    "browser: drives the real app in headless Chromium via Playwright; skips cleanly when Playwright or its browser binary is absent",
]
