[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictivesense"
version = "0.1.0"
description = "PredictiveSense research prototype - Phase 1 input layer (camera enumeration/ownership, browser-worker ingest, backend device + recorded-video sources, raw clip recorder, transport metrics)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary - research prototype" }

# Runtime dependencies. Pinned exactly. Every entry is justified in docs/attribution.md.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.6.1",
    "PyYAML==6.0.2",
    "numpy==2.2.1",
    "psutil==6.1.1",
    "opencv-python==4.10.0.84",
    "python-multipart==0.0.20",
    # NOTE: the ONNX Runtime is deliberately NOT here - it goes in exactly one of
    # the mutually-exclusive [cpu] / [cuda] extras below, because `onnxruntime`,
    # `onnxruntime-gpu` and `onnxruntime-directml` install the SAME module name
    # and cannot coexist in one environment. See docs/setup.md.
]

[project.optional-dependencies]
# --- ONNX Runtime: pick EXACTLY ONE of these per environment ------------------
# The CPU environment (the default, and the one the full test suite must pass
# in) must never pull a GPU package.
#   pip install -e ".[cpu,dev]"       # laptop / CI - CPUExecutionProvider
#   pip install -e ".[cuda,dev]"      # NVIDIA machine - CUDAExecutionProvider
# They are mutually exclusive; installing both breaks the import. `perception.
# provider: auto` then picks the best EP actually present (docs/setup.md).
cpu = [
    "onnxruntime==1.24.4",
]
cuda = [
    # ORT's CUDA EP requires a matching CUDA + cuDNN runtime; 1.24.x pairs with
    # CUDA 12.x + cuDNN 9.x (see docs/setup.md for the exact versions and the
    # `nvcc` / cuDNN checks). onnxruntime-gpu ships CPUExecutionProvider too, so
    # `provider: cpu` still works from a [cuda] environment.
    "onnxruntime-gpu==1.24.4",
]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    # Phase 6: browser smoke tests for the Object Learning Studio. The ONLY new
    # dependency this phase (two consecutive phases shipped frontend defects the
    # suite reported as fixed). `browser`-marked tests skip cleanly when the
    # package or its Chromium binary is absent - see tests/browser/conftest.py.
    # Base package only; the fixtures are hand-rolled (no pytest-playwright).
    "playwright==1.62.0",
]
# Windows-only: human-readable DirectShow camera names for backend enumeration.
# Never imported at import time; a missing or throwing pygrabber degrades to
# "Camera <index>" and logs once. See predictivesense/camera/enumerate.py.
camera = [
    "pygrabber==0.2",
]
# Phase 11 Part B: training the Object Learning Studio's crop classifier.
# ONLY `predictivesense/training/*` imports torch/torchvision - the runtime app
# (pipeline/, api/) never does, so a serving-only environment need not install
# this extra. Serving a trained model goes through ONNX Runtime
# (perception/classifier.py), same as the detector and pose estimator, not
# through this extra. CPU wheels (`--index-url https://download.pytorch.org/whl/cpu`)
# keep this small and avoid pulling a CUDA runtime on the CPU-only dev machine;
# CUDA is used automatically when torch itself is installed with CUDA support
# and reports it (see `training/train.py::_machine_fingerprint`/provider field).
train = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    # torch.onnx.export's default (dynamo) exporter needs this - training-only,
    # never imported by the serving path (perception/classifier.py uses plain
    # onnxruntime).
    "onnxscript==0.7.2",
]
# Phase 12: importing an external dataset (e.g. a FiftyOne Open Images V7
# export) into data/external/. ONLY scripts/audit_external_dataset.py and
# scripts/import_external_dataset.py use pandas - predictivesense/ itself
# never does (enforced by tests/unit/test_no_forbidden_imports.py), and the
# fiftyone package itself is never imported anywhere in this repo: both
# scripts read the raw exported CSV/JSON files FiftyOne wrote to disk
# directly, so fiftyone is not even a dependency of the import path, only of
# the one-time manual download the developer already did.
external = [
    "pandas==3.0.5",
]

[tool.setuptools.packages.find]
include = ["predictivesense*"]

[tool.setuptools.package-data]
"predictivesense.api.static" = ["**/*.html", "**/*.js", "**/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Project-local basetemp: the shared system temp dir is not reliably writable
# in this sandboxed environment.
addopts = "--import-mode=importlib --basetemp=.pytest_tmp"
markers = [
    "unit: fast, isolated, no threads or I/O",
    "integration: multiple components wired together",
    "slow: runs for several seconds or more",
    "hardware: requires a physical camera; skipped unless --run-hardware is passed",
    "models: requires ONNX weights under models/; skips cleanly when they are absent",
    "dataset: requires the labelled evaluation set under data/eval/; skips cleanly when it is absent",
    "browser: drives the real app in headless Chromium via Playwright; skips cleanly when Playwright or its browser binary is absent",
    "cuda: requires an onnxruntime build with CUDAExecutionProvider; skips cleanly when it is absent, runs on the NVIDIA machine",
    "train: requires the [train] extra (torch/torchvision); skips cleanly when it is absent",
    "external: requires the downloaded external dataset under data/external/ or a raw FiftyOne export; skips cleanly when absent",
]
