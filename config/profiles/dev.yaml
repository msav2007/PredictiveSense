# Development profile: modest rates, verbose logging, local-only API.
mode: realtime
results_dir: results

logging:
  level: INFO

source:
  kind: synthetic
  width: 640
  height: 480
  target_fps: 30.0
  seed: 12345

consumer:
  sample_rate_hz: 20.0
  stale_after_ms: 500.0

broadcast:
  rate_hz: 10.0
  client_send_timeout_s: 5.0

api:
  host: 127.0.0.1
  port: 8000

noop:
  default_seconds: 60
  csv_sample_period_s: 1.0
  max_rss_growth_mb: 25.0

# Phase 1 input layer. source.kind stays `synthetic` so `run_noop` and the
# Phase 0 tests keep their behaviour; run the real browser input layer with
#   python scripts\run_app.py --profile dev --source-kind browser
# (or --source-kind device with capture.owner: backend).
capture:
  owner: browser
  device_index: 0
  device_backend: auto
  request_width: 1280
  request_height: 720
  request_fps: 30
  # Measured on the integrated camera: MSMF negotiates its own format at a full
  # 30 fps up to 1080p with zero drops; forcing MJPG gave no gain and adds JPEG
  # decode. Leave fourcc auto. buffer_size 1 = newest-frame-only (no-op on MSMF,
  # helps DSHOW / virtual-camera latency).
  fourcc: auto
  buffer_size: 1
  warmup_frames: 0
  open_timeout_s: 5.0
  reconnect_initial_s: 0.5
  reconnect_max_s: 8.0
  analysis_fps: 10
  analysis_width: 640
  analysis_height: 480
  analysis_jpeg_quality: 0.7
  max_ingest_message_bytes: 2000000

recorder:
  enabled: true
  max_clip_mb: 500
  output_dir: data/raw

video:
  input_dir: data/videos
  replay_mode: asfast
