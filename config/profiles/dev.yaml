# Development profile: modest rates, verbose logging, local-only API.
mode: realtime
results_dir: results

logging:
  level: INFO

source:
  kind: synthetic
  width: 640
  height: 480
  target_fps: 30.0
  seed: 12345

consumer:
  sample_rate_hz: 20.0
  stale_after_ms: 500.0
  # Phase 8 (docs/phase-reports/phase8.md, docs/decisions.md): "completion" is
  # shipped and tested but the default stays "timer" - on this machine inference
  # (~130-225 ms) exceeds the 50 ms tick, so the timer's catch-up clamp already
  # picks up a frame the instant the previous iteration finishes; the loopback
  # measured timer == completion. max_analysis_rate_hz is the completion-mode
  # CPU ceiling.
  scheduler: timer
  max_analysis_rate_hz: 30.0

broadcast:
  rate_hz: 10.0
  client_send_timeout_s: 5.0

# Phase 8 staleness guard. Derived from results/latency_stages_*.json: the frame
# age at mailbox dequeue is p50 ~60 ms / p95 ~110 ms in steady state, so 180 ms
# never fires on normal jitter but drops a frame once the consumer has fallen
# ~2 inference cycles behind (a hitch) - keeping the overlay's world fresh
# instead of analysing a scene that has passed. 0 disables it.
analysis:
  max_frame_age_ms: 180.0

api:
  host: 127.0.0.1
  port: 8000

noop:
  default_seconds: 60
  csv_sample_period_s: 1.0
  max_rss_growth_mb: 25.0

# Phase 1 input layer. source.kind stays `synthetic` so `run_noop` and the
# Phase 0 tests keep their behaviour; run the real browser input layer with
#   python scripts\run_app.py --profile dev --source-kind browser
# (or --source-kind device with capture.owner: backend).
capture:
  owner: browser
  device_index: 0
  device_backend: auto
  request_width: 1280
  request_height: 720
  request_fps: 30
  # Measured on the integrated camera (results/camera_matrix_integrated.md):
  # MSMF negotiates its own format at a full 30 fps up to 1080p with zero drops;
  # forcing MJPG gave no gain and adds JPEG decode. Leave fourcc auto.
  # buffer_size 1 = newest-frame-only (no-op on MSMF, helps DSHOW /
  # virtual-camera latency).
  fourcc: auto
  buffer_size: 1
  warmup_frames: 0
  open_timeout_s: 5.0
  reconnect_initial_s: 0.5
  reconnect_max_s: 8.0
  # Analysis-path defaults from results/analysis_sweep_loopback.md: 10 fps /
  # 640x480 / q0.70 gives the lowest frame age + drops at usable quality.
  analysis_fps: 10
  analysis_width: 640
  analysis_height: 480
  analysis_jpeg_quality: 0.7
  max_ingest_message_bytes: 2000000
  # Worker skips (never queues) an analysis frame when the WS send buffer is
  # above this. results/analysis_sweep_loopback.md: keeps frame age bounded
  # when the consumer briefly stalls.
  max_ws_buffered_bytes: 1000000

recorder:
  enabled: true
  max_clip_mb: 500
  output_dir: data/raw

video:
  input_dir: data/videos
  replay_mode: asfast

# Phase 2 perception. Both models run on the sampled analysis frame in real-time
# and recorded modes. Turn both *_enabled off to reproduce Phase 1.6 exactly.
perception:
  detection_enabled: true
  pose_enabled: true
  pose_every_n: 1   # legacy knob; superseded by pose_cadence below
  # Phase 8 (section 9, docs/decisions.md): pose is decoupled from detection.
  # Loopback measured cap->snapshot p50 ~225 -> 138 ms, analysis FPS ~6 -> 11,
  # drop rate ~0.4 -> 0.02 at every_n:2 with NO loss of pose - a frame without a
  # fresh pose reuses the last one as an immutable value object carrying its own
  # frame_id / capture_ts / age_ms and stale=true (overlay de-emphasises it),
  # bounded by pose_max_reuse_ms. Cadence decisions use frame capture time, so
  # recorded mode stays byte-deterministic.
  pose_cadence: "every_n:2"
  pose_max_reuse_ms: 500.0
  # ORT intra-op threads per session. Auto (all 18 logical cores) over-subscribes
  # with two sessions + the loop threads: measured combined p50 collapsed to
  # ~440 ms. 6 is the measured knee (~90-110 ms combined). See phase2.md.
  intra_op_threads: 6
  # Phase 8: never hard-coded. "auto" tries cuda -> directml -> cpu and takes the
  # first available EP, always falling back to CPU and logging which + why. On
  # this CPU-only machine that resolves to CPU (measured best here: DirectML on
  # the Arc iGPU agrees numerically but is ~2.2x slower for these nano models -
  # results/providers_cpu.json vs providers_dml.json). On the NVIDIA laptop the
  # same config picks CUDA. An explicit `provider: cuda` that is unavailable is a
  # LOUD failure, not a silent CPU fallback. The EP actually in use is reported
  # in Diagnostics, the session manifest and every result file.
  provider: auto
  detector:
    model_path: models/yolo11n.onnx
    input_size: 640            # sweep {320,480,640}: 640 keeps small objects; see report
    nms_iou: 0.5
    default_conf: 0.35
    class_thresholds: {}       # per-class overrides go here once the audit verdicts land
    low_confidence_band: [0.35, 0.50]   # rendered dashed / dimmed on the overlay
    max_detections: 100
  pose:
    model_path: models/yolo11n-pose.onnx
    input_size: 640            # yolo11n-pose ONNX locks its input to 640x640
    conf: 0.4
    max_persons: 4
    keypoint_visibility_threshold: 0.3
  # Phase 2.5: run pose only on frames where the detector saw a person.
  # Before/after cost in docs/phase-reports/phase2_5.md "Latency". Off by
  # default (no behaviour change until measured to help on this machine).
  pose_requires_person: false

# Phase 2.5 recognition policy, redesigned in Phase 5. Sits after the detector,
# before the snapshot; the detector itself is unchanged. Every rule is switchable
# and every outcome counted - the six policy_state values reconcile exactly.
# enabled:false reproduces Phase 2 exactly.
#
# Phase 5: the binary whitelist is replaced by three tiers. primary + secondary +
# implausible must be a total, disjoint partition of the detector's COCO-80
# vocabulary (validated at load - a typo / duplicate / gap fails loudly). primary
# and secondary are BOTH shown on the overlay (secondary de-emphasised); only
# implausible is suppressed. This keeps the general model useful out of the box -
# person, laptop, keyboard, chair, bottle, cup, clock, tv all work with no
# enrolment. Tier assignment is an environment-specific JUDGEMENT, not a measured
# result - see docs/decisions.md; cheap to revise once labelled data exists.
policy:
  enabled: true
  domain_restriction: true      # suppress the `implausible` tier
  margin_rule: true
  size_rule: true
  per_class_threshold_rule: true
  vocabulary:
    primary: [person, cup, bottle, laptop, keyboard, mouse, chair, book,
              cell phone, backpack, handbag, scissors, bowl, remote]
    secondary: [clock, tv, bed, couch, dining table, sink, potted plant, vase,
                refrigerator, microwave, oven, toaster, toilet, teddy bear,
                hair drier, toothbrush, wine glass, fork, knife, spoon, bench,
                umbrella, tie, suitcase, cat, dog]
    implausible: [bicycle, car, motorcycle, airplane, bus, train, truck, boat,
                  traffic light, fire hydrant, stop sign, parking meter, bird,
                  horse, sheep, cow, elephant, bear, zebra, giraffe, frisbee,
                  skis, snowboard, sports ball, kite, baseball bat,
                  baseball glove, skateboard, surfboard, tennis racket, banana,
                  apple, sandwich, orange, broccoli, carrot, hot dog, pizza,
                  donut, cake]
  # UNFITTED until scripts/fit_thresholds.py runs on a labelled `val` split; the
  # UI states this plainly. per_class_thresholds / default_threshold / margin_min
  # below are placeholder defaults (judgement calls, documented in decisions.md).
  thresholds_fitted: false
  per_class_thresholds: {}
  default_threshold: 0.35
  margin_min: 0.10               # top1 - top2 below this -> unknown (unfitted)
  min_box_area_frac: 0.0005
  emit_unknown: true             # unknown keeps its box (BLOCK 3.14)
  show_suppressed_in_diagnostics: true
  aspect_ratio_bounds: {}        # per-class w/h sanity bounds; opt-in, see decisions.md

# Phase 2.5 labelled evaluation set (COCO detection JSON) + eval harness.
dataset:
  root: data/eval
  coco_path: data/eval/annotations.json
  splits_path: data/eval/splits.json
  frames_dirname: frames
  min_unseeded_fraction: 0.30    # >=30% of frames labelled with seeding OFF (bias check)

eval:
  iou_threshold: 0.5
  results_dir: results
  val_fraction: 0.5             # session-disjoint; test opened once, at the end
  test_fraction: 0.5
  split_seed: 20260908

# Phase 4 Object Learning Studio - environment-specific object DATA COLLECTION.
# No model is trained here; storing images is not training. The object dataset is
# strictly separate from the Phase 2.5 evaluation set (data/eval). Quality
# thresholds and coverage targets are collection HEURISTICS, not validated
# metrics - see docs/decisions.md.
objects:
  root: data/objects
  max_image_mb: 12
  thumbnail_px: 240
  blur_var_min: 60.0            # variance-of-Laplacian; below -> "blurry" flag (not auto-deleted)
  min_box_area_frac: 0.01
  duplicate_hamming_max: 6      # dHash Hamming distance for the near-duplicate flag
  coverage_targets:
    min_positives: 20
    min_views: 4
    min_distances: 2
    min_lighting: 2
    min_occluded: 2
    min_hard_negatives: 5
  # Phase 7 bulk image upload. Boxes are PROPOSED from the detector's raw output
  # (before the recognition policy - the policy would suppress exactly the box we
  # want); the predicted label is a hint only, never the sample class. No model
  # is trained here. proposal_min_score is deliberately low: we want a rectangle,
  # not a confident class.
  batch:
    max_images: 60
    max_total_mb: 400
    staging_ttl_hours: 24
    proposal_min_score: 0.10
    thumbnail_px: 240
    min_image_px: 32

studio:
  # Entering /studio stops monitoring (worker terminated, ingest socket closed,
  # perception disabled, analysis loop paused); leaving restores it exactly.
  stop_monitoring_on_enter: true

ui:
  panel:
    default_width_px: 380
    min_width_px: 300
    max_width_px: 560
    max_width_frac: 0.40
