# Evaluation profile: recorded mode, higher resolution, quiet logging.
mode: recorded
results_dir: results

logging:
  level: WARNING

source:
  kind: synthetic
  width: 1280
  height: 720
  target_fps: 15.0
  seed: 2024

consumer:
  sample_rate_hz: 15.0
  stale_after_ms: 1000.0

broadcast:
  rate_hz: 5.0
  client_send_timeout_s: 5.0

api:
  host: 127.0.0.1
  port: 8001

noop:
  default_seconds: 60
  csv_sample_period_s: 1.0
  max_rss_growth_mb: 25.0

# Phase 1: tuned for deterministic offline (Mode B) runs. `asfast` replay, no
# pacing; RecordedDriver output is byte-identical across runs for one file.
capture:
  owner: backend
  device_index: 0
  device_backend: auto
  request_width: 1280
  request_height: 720
  request_fps: 30
  # See results/camera_matrix_integrated.md (Phase 1.5). Defaults unchanged -
  # measured optimal for the integrated camera.
  fourcc: auto
  buffer_size: 1
  warmup_frames: 0
  open_timeout_s: 5.0
  reconnect_initial_s: 0.5
  reconnect_max_s: 8.0
  # Analysis-path defaults from results/analysis_sweep_loopback.md (Phase 1.5).
  analysis_fps: 10
  analysis_width: 640
  analysis_height: 480
  analysis_jpeg_quality: 0.7
  max_ingest_message_bytes: 2000000
  max_ws_buffered_bytes: 1000000

recorder:
  enabled: false
  max_clip_mb: 500
  output_dir: data/raw

video:
  input_dir: data/videos
  replay_mode: asfast

# Phase 2 perception - identical model/settings to dev so Mode B (recorded)
# analysis and Mode A (real-time) run the same code. RecordedDriver output is
# byte-deterministic for a given model + config + file.
perception:
  detection_enabled: true
  pose_enabled: true
  pose_every_n: 1
  intra_op_threads: 6        # measured knee on 14C/18T; auto over-subscribes (phase2.md)
  # cpu: DirectML agrees numerically but is ~2.2x slower for these nano models on
  # the Arc iGPU (results/providers_cpu.json vs providers_dml.json).
  provider: cpu
  detector:
    model_path: models/yolo11n.onnx
    input_size: 640
    nms_iou: 0.5
    default_conf: 0.35
    class_thresholds: {}
    low_confidence_band: [0.35, 0.50]
    max_detections: 100
  pose:
    model_path: models/yolo11n-pose.onnx
    input_size: 640
    conf: 0.4
    max_persons: 4
    keypoint_visibility_threshold: 0.3
