# Evaluation profile: recorded mode, higher resolution, quiet logging.
mode: recorded
results_dir: results

logging:
  level: WARNING

source:
  kind: synthetic
  width: 1280
  height: 720
  target_fps: 15.0
  seed: 2024

consumer:
  sample_rate_hz: 15.0
  stale_after_ms: 1000.0

broadcast:
  rate_hz: 5.0
  client_send_timeout_s: 5.0

api:
  host: 127.0.0.1
  port: 8001

noop:
  default_seconds: 60
  csv_sample_period_s: 1.0
  max_rss_growth_mb: 25.0

# Phase 1: tuned for deterministic offline (Mode B) runs. `asfast` replay, no
# pacing; RecordedDriver output is byte-identical across runs for one file.
capture:
  owner: backend
  device_index: 0
  device_backend: auto
  request_width: 1280
  request_height: 720
  request_fps: 30
  # See results/camera_matrix_integrated.md (Phase 1.5). Defaults unchanged -
  # measured optimal for the integrated camera.
  fourcc: auto
  buffer_size: 1
  warmup_frames: 0
  open_timeout_s: 5.0
  reconnect_initial_s: 0.5
  reconnect_max_s: 8.0
  # Analysis-path defaults from results/analysis_sweep_loopback.md (Phase 1.5).
  analysis_fps: 10
  analysis_width: 640
  analysis_height: 480
  analysis_jpeg_quality: 0.7
  max_ingest_message_bytes: 2000000
  max_ws_buffered_bytes: 1000000

recorder:
  enabled: false
  max_clip_mb: 500
  output_dir: data/raw

video:
  input_dir: data/videos
  replay_mode: asfast

# Phase 2 perception - identical model/settings to dev so Mode B (recorded)
# analysis and Mode A (real-time) run the same code. RecordedDriver output is
# byte-deterministic for a given model + config + file.
perception:
  detection_enabled: true
  pose_enabled: true
  pose_every_n: 1
  intra_op_threads: 6        # measured knee on 14C/18T; auto over-subscribes (phase2.md)
  # cpu: DirectML agrees numerically but is ~2.2x slower for these nano models on
  # the Arc iGPU (results/providers_cpu.json vs providers_dml.json).
  provider: cpu
  detector:
    model_path: models/yolo11n.onnx
    input_size: 640
    nms_iou: 0.5
    default_conf: 0.35
    class_thresholds: {}
    low_confidence_band: [0.35, 0.50]
    max_detections: 100
  pose:
    model_path: models/yolo11n-pose.onnx
    input_size: 640
    conf: 0.4
    max_persons: 4
    keypoint_visibility_threshold: 0.3
  pose_requires_person: false   # Phase 2.5 - see docs/phase-reports/phase2_5.md

# Phase 2.5 / Phase 5 - identical policy settings to dev so real-time and
# recorded modes run the same recognition policy code. Three-tier vocabulary
# (total, disjoint partition of COCO-80); primary + secondary shown, implausible
# suppressed. Tiers are an environment-specific judgement (docs/decisions.md).
policy:
  enabled: true
  domain_restriction: true      # suppress the `implausible` tier
  margin_rule: true
  size_rule: true
  per_class_threshold_rule: true
  vocabulary:
    primary: [person, cup, bottle, laptop, keyboard, mouse, chair, book,
              cell phone, backpack, handbag, scissors, bowl, remote]
    secondary: [clock, tv, bed, couch, dining table, sink, potted plant, vase,
                refrigerator, microwave, oven, toaster, toilet, teddy bear,
                hair drier, toothbrush, wine glass, fork, knife, spoon, bench,
                umbrella, tie, suitcase, cat, dog]
    implausible: [bicycle, car, motorcycle, airplane, bus, train, truck, boat,
                  traffic light, fire hydrant, stop sign, parking meter, bird,
                  horse, sheep, cow, elephant, bear, zebra, giraffe, frisbee,
                  skis, snowboard, sports ball, kite, baseball bat,
                  baseball glove, skateboard, surfboard, tennis racket, banana,
                  apple, sandwich, orange, broccoli, carrot, hot dog, pizza,
                  donut, cake]
  thresholds_fitted: false      # UNFITTED - scripts/fit_thresholds.py needs a labelled val split
  per_class_thresholds: {}
  default_threshold: 0.35
  margin_min: 0.10
  min_box_area_frac: 0.0005
  emit_unknown: true
  show_suppressed_in_diagnostics: true
  aspect_ratio_bounds: {}

dataset:
  root: data/eval
  coco_path: data/eval/annotations.json
  splits_path: data/eval/splits.json
  frames_dirname: frames
  min_unseeded_fraction: 0.30

eval:
  iou_threshold: 0.5
  results_dir: results
  val_fraction: 0.5
  test_fraction: 0.5
  split_seed: 20260908

# Phase 4 - identical Studio / panel settings to dev so both modes behave the
# same. No model is trained; the object dataset is separate from data/eval.
objects:
  root: data/objects
  max_image_mb: 12
  thumbnail_px: 240
  blur_var_min: 60.0
  min_box_area_frac: 0.01
  duplicate_hamming_max: 6
  coverage_targets:
    min_positives: 20
    min_views: 4
    min_distances: 2
    min_lighting: 2
    min_occluded: 2
    min_hard_negatives: 5

studio:
  stop_monitoring_on_enter: true

ui:
  panel:
    default_width_px: 380
    min_width_px: 300
    max_width_px: 560
    max_width_frac: 0.40
